<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#ff6a13"><link rel="apple-touch-icon" href="icon-192.png"><title>Basket Performance — Meu Treinador</title>
<style>
:root{--bg:#0e0e10;--c:#18181b;--c2:#242429;--t:#f4f4f5;--m:#9b9ba4;--o:#ff6a13;--r:#ff5050;--g:#3ddc84;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:light){:root:not([data-t]){--bg:#f5f5f7;--c:#fff;--c2:#ececf0;--t:#161618;--m:#6a6a72}}
:root[data-t=l]{--bg:#f5f5f7;--c:#fff;--c2:#ececf0;--t:#161618;--m:#6a6a72}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--t);font:16px/1.4 system-ui,sans-serif;padding:0 14px 120px}
h1{font-size:20px;margin:16px 0 4px;letter-spacing:-.5px}h1 b{color:var(--o)}h2{margin:2px 0 10px;font-size:24px;letter-spacing:-.5px}h3{margin:0 0 10px;font-size:16px}h4{margin:0;font-size:16px}
.cd{background:var(--c);border-radius:18px;padding:16px;margin:12px 0}.hero{background:linear-gradient(135deg,#ff6a1330,var(--c))}.m{color:var(--m);font-size:13px;margin:4px 0}
.warn{border-left:4px solid var(--r)}
button{background:var(--c2);color:var(--t);border:0;border-radius:12px;padding:12px 14px;font-size:15px;margin:3px 3px 3px 0}
.pb{background:var(--o);color:#fff;font-weight:700;display:block;width:100%;margin:8px 0 0;padding:14px;font-size:16px}.sm{padding:7px 12px;font-size:13px}
input,select,textarea{background:var(--c2);color:var(--t);border:0;border-radius:12px;padding:12px;font-size:16px;width:100%;box-sizing:border-box;margin:4px 0}
input[type=checkbox]{width:30px;height:30px;flex:none;accent-color:var(--o)}
label{display:block;font-size:13px;color:var(--m);margin-top:8px}
.ck{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--t);margin:0;padding:7px 0}details{margin:10px 0}summary{cursor:pointer}.row{display:flex;gap:8px;align-items:center}.row span{width:28px;color:var(--o);font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.st{background:var(--c2);border-radius:14px;padding:10px;text-align:center}.st b{display:block;font-size:22px;color:var(--o)}.st small{color:var(--m);font-size:11px}
.bar{background:var(--c2);height:10px;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--o)}
.ch{display:flex;gap:4px;align-items:flex-end;height:140px;overflow-x:auto}.b{flex:1;min-width:38px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px}.b i{width:70%;background:var(--o);min-height:2px;border-radius:4px 4px 0 0}.b s{text-decoration:none;color:var(--m)}
.day{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--c2)}.day:last-of-type{border:0}.day.hj{color:var(--o);font-weight:700}
.sg{display:flex;background:var(--c);border-radius:14px;padding:4px;margin:12px 0}.sg button{flex:1;margin:0;background:none;color:var(--m);padding:10px 4px}.sg .a{background:var(--o);color:#fff;font-weight:700}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--c);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -2px 12px #0006}
#tb{display:none;align-items:center;gap:4px;padding:6px 12px;border-bottom:1px solid var(--c2);font-size:13px}#tb b{color:var(--o);font-size:20px;min-width:52px}#tb button{padding:6px 10px;margin:0}
#tabs{display:flex;max-width:560px;margin:0 auto}#tabs button{flex:1;background:none;border-radius:0;font-size:11px;padding:8px 2px;margin:0;color:var(--m)}#tabs button span{display:block;font-size:20px}#tabs .a{color:var(--o);font-weight:700}
</style></head><body>
<h1>🏀 <b>Basket</b> Performance</h1><div id="app"></div>
<nav><div id="tb">⏱<b id="tm">0:00</b><button onclick="rest(60)">60s</button><button onclick="rest(90)">90s</button><button onclick="rest(120)">2min</button><button onclick="stopT()">✕</button></div><div id="tabs"></div></nav>
<script>
const D=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],$=i=>document.getElementById(i);
const iso=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')},today=()=>iso(new Date());
const fd=k=>k.slice(8)+'/'+k.slice(5,7),T12=k=>new Date(k+'T12:00');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const def=()=>({jogo:false,ant:false,log:[],tiro:[],ov:{},cfg:{ini:today(),tema:'',desc:90,hor:'Seg–Sex: 13h–18h e 20h–23h\nSáb: 10h–14h ou 12h–16h'}});
let S=def();try{Object.assign(S,JSON.parse(localStorage.getItem('bp1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('bp1',JSON.stringify(S));snap()}catch(e){alert('Não foi possível salvar neste navegador. Faça backup manual.')}};
const PS=['Descanso','Musculação A — Força','Aeróbico e fundamentos','Musculação B — Superiores','Descanso','Musculação C — Potência','Quadra intensa ou rachão'];
const PJ=['Partida','Descanso','Musculação A — Força','Musculação B — Superiores','Descanso','Musculação C — Potência leve','Treino técnico leve'];
const OPTS=[...new Set([...PS,...PJ])];
const plan=k=>S.ov[k]||(S.jogo?PJ:PS)[T12(k).getDay()];
const NM={A:'Treino A — Força de inferiores',B:'Treino B — Superiores adaptado',C:'Treino C — Potência'};
const EX={A:[['Agachamento','Quadríceps/glúteos',3,'6','Coluna neutra, joelhos alinhados aos pés, descida controlada.'],['Agachamento búlgaro','Quadríceps/glúteos',3,'8 por perna','Pé de trás apoiado, tronco firme, desça vertical.'],['Mesa flexora','Posteriores',3,'10','Movimento lento, sem tirar o quadril do banco.'],['Cadeira extensora','Quadríceps',2,'12','Estenda sem travar o joelho.'],['Panturrilha','Panturrilhas',3,'15','Amplitude completa, pausa no topo.'],['Abdominal reverso','Abdômen',3,'12','Suba o quadril sem balançar.']],
B:[['Peck deck ou Cross','Peitoral',3,'10–12','Sem dor. Amplitude confortável para o ombro direito.'],['Remada na polia','Dorsais',3,'10','Escápulas para trás, tronco estável.'],['Puxada dorsal','Dorsais',3,'10','Puxe até a altura do queixo, sem balançar.'],['Crucifixo invertido','Deltoide posterior',2,'12','Carga leve, controle total.'],['Desenvolvimento (opcional — só com liberação do fisioterapeuta)','Ombros',2,'10','Opcional. Pare ao primeiro sinal de dor.'],['Rosca bíceps','Bíceps',2,'12','Cotovelos junto ao corpo.']],
C:[['Salto vertical','Potência de pernas',3,'3','Máxima intenção, aterrisse suave, descanso completo.'],['Subida rápida em degrau baixo','Pernas',2,'6 por perna','Suba explosivo, desça controlado.'],['Agachamento leve com subida explosiva','Pernas',2,'5','Carga leve, velocidade máxima na subida.'],['Panturrilha','Panturrilhas',2,'12','Rápido na subida, controlado na descida.'],['Abdominal reverso','Abdômen',2,'12','Sem balançar.']]};
const Q={'Fundamentos ofensivos':['Dribles','Controle de bola','Mudança de direção','Infiltração','Bandejas','Arremessos de média distância','Arremessos de três pontos','Lances livres'],'Fundamentos defensivos':['Deslocamento lateral','Marcação individual','Pressão sobre o armador','Defesa em zona 2–3','Defesa em zona 3–2','Recuperação defensiva'],'Condicionamento':['Acelerações','Mudanças de direção','Resistência aeróbica','Esforços repetidos','Transições ofensivas e defensivas']};
const TABS=[['hoje','Hoje','🏠'],['treinar','Treinar','🏋️'],['evo','Evolução','📈'],['mais','Mais','⚙️']];
let tab='hoje',sub={t:'musc',e:'des'},sess=null,rg={p:'sem'},exSel='';
const num=(v,a,b)=>v!==''&&v!=null&&!isNaN(+v)&&+v>=a&&+v<=b;
const pct=(a,t)=>t>0?Math.round(a/t*1000)/10:null,pf=v=>v==null?'n/d':v+'%';
function mon(k){const x=T12(k);x.setDate(x.getDate()-((x.getDay()+6)%7));return iso(x)}
function wk(){const m=mon(today()),a=[];for(let i=0;i<7;i++){const x=T12(m);x.setDate(x.getDate()+i);a.push(iso(x))}return a}
function range(){const w=wk(),t=today();if(rg.p==='sem')return[w[0],w[6]];if(rg.p==='mes')return[t.slice(0,8)+'01',t];if(rg.p==='all'){const ds=[...S.log.map(e=>e.d),...S.tiro.map(e=>e.d)].sort();return[ds[0]||t,t]}return[rg.f||t,rg.t||t]}
function stats(f,t){const es=S.log.filter(e=>e.d>=f&&e.d<=t),ts=S.tiro.filter(e=>e.d>=f&&e.d<=t);let pl=0,dn=0;const end=t<today()?t:today();for(let d=T12(f);iso(d)<=end;d.setDate(d.getDate()+1)){const k=iso(d);if(plan(k)!=='Descanso'){pl++;if(es.some(e=>e.d===k))dn++}}
const a=ts.reduce((s,e)=>s+e.a,0),tt=ts.reduce((s,e)=>s+e.t,0);return{n:es.length,vol:Math.round(es.reduce((s,e)=>s+(e.vol||0),0)),min:es.filter(e=>e.t==='quadra').reduce((s,e)=>s+(+e.dur||0),0),ad:pl?Math.round(dn/pl*100):null,sh:pct(a,tt),es}}
function bars(a,u){if(!a.length)return'<p class=m>Sem dados ainda.</p>';const mx=Math.max(...a.map(x=>x[1]||0),1);return'<div class=ch>'+a.map(x=>`<div class=b><span>${x[1]==null?'n/d':x[1]+(u||'')}</span><i style="height:${Math.round((x[1]||0)/mx*100)}%"></i><s>${x[0]}</s></div>`).join('')+'</div>'}
function lastLoad(n){for(let i=S.log.length-1;i>=0;i--){const x=(S.log[i].ex||[]).find(e=>e.n===n);if(x){const c=x.sets.filter(s=>s.ok&&+s.c>0).map(s=>+s.c);if(c.length)return Math.max(...c)}}return null}
function tol(){const l=S.log.filter(e=>e.dor!=null).slice(-3);return l.length>=2&&l.every(e=>e.dor<=2&&e.fad<=6&&e.sono>=6)}
function wkInfo(){const d=Math.floor((T12(today())-T12(S.cfg.ini))/864e5),n=Math.min(4,Math.max(1,Math.floor(d/7)+1));const m=['','Adaptação: estabeleça as cargas e monitore a recuperação.','Adaptação: estabeleça as cargas e monitore a recuperação.',tol()?'Boa tolerância nos últimos registros: você pode considerar uma progressão individual, mudando as cargas manualmente.':'Mantenha as cargas: os registros ainda não mostram tolerância suficiente (dor, fadiga ou sono). Nenhuma carga é aumentada automaticamente.','Avaliação: compare desempenho e revise a programação.'];return{n,pct:Math.min(100,Math.max(0,Math.round(d/28*100))),msg:m[n]+(d>=28?' Ciclo concluído — reinicie a data em Perfil/Config.':'')}}
function alertas(){let h='';if(S.ant)h+='<div class="cd warn">Houve partida no domingo anterior: priorize a recuperação nesta semana e ajuste cargas manualmente, se necessário.</div>';const l=[...S.log].reverse().find(e=>e.dor!=null);if(l&&l.dor>=4)h+=`<div class="cd warn"><b>⚠ Dor no ombro ${l.dor}/10</b> em ${fd(l.d)}. Interrompa o movimento envolvido e procure seu fisioterapeuta antes de continuar. O app não faz diagnóstico nem libera exercícios.</div>`;return h}
function tg(){return`<div class=cd><button onclick="tgl('jogo')">Jogo no domingo: <b>${S.jogo?'SIM':'NÃO'}</b></button><button onclick="tgl('ant')">Jogou no domingo anterior: <b>${S.ant?'SIM':'NÃO'}</b></button></div>`}
const tgl=k=>{S[k]=!S[k];save();R()};
const V={};
V.hoje=()=>{const k=today(),p=plan(k),L=p.match(/Musculação (\w)/),w=wkInfo(),btn=L?`<button class=pb onclick="startS('${L[1]}');sub.t='musc';go('treinar')">Iniciar ficha ${L[1]}</button>`:/Quadra|Aeróbico|técnico/.test(p)?`<button class=pb onclick="sub.t='quadra';go('treinar')">Registrar treino de quadra</button>`:'<p class=m>Dia de recuperação 😴</p>';
return`<div class="cd hero"><small class=m>${D[T12(k).getDay()]}, ${fd(k)}</small><h2>${esc(p)}</h2>${btn}</div>`+alertas()+V.cal()+`<div class=cd><h3>Semana de jogo?</h3><button onclick="tgl('jogo')">Jogo no domingo: <b>${S.jogo?'SIM':'NÃO'}</b></button><button onclick="tgl('ant')">Jogou domingo passado: <b>${S.ant?'SIM':'NÃO'}</b></button></div><div class=cd><h3>Ciclo · semana ${w.n}/4</h3><div class=bar><i style="width:${w.pct}%"></i></div><p class=m>${w.msg}</p></div>`};
V.cal=()=>`<div class=cd><h3>Semana</h3>`+wk().map(k=>`<div class="day ${k===today()?'hj':''}"><div>${D[T12(k).getDay()].slice(0,3)} ${fd(k)} ${S.log.some(e=>e.d===k)?'✔':''}</div><select style="width:62%" onchange="ov('${k}',this.value)">${OPTS.map(o=>`<option ${o===plan(k)?'selected':''}>${o}</option>`).join('')}<option value="">↺ Padrão</option></select></div>`).join('')+`<p class=m>Remarque manualmente quando precisar. Treinos já realizados (✔) nunca são movidos.</p></div>`;
const ov=(k,v)=>{if(v)S.ov[k]=v;else delete S.ov[k];save();R()};
function startS(t){sess={t,ex:EX[t].map(e=>({n:e[0],sets:Array.from({length:e[2]},()=>({c:'',r:'',ok:false}))}))};R()}
V.musc=()=>{if(!sess)return`<div class=cd><h3>Escolha a ficha</h3>${['A','B','C'].map(l=>`<button class=pb onclick="startS('${l}')">${NM[l]}</button>`).join('')}</div><div class="cd warn"><b>Suspensos (lesão no ombro direito):</b> supino reto, supino inclinado e elevação lateral. Os demais movimentos de ombro dependem da orientação do fisioterapeuta.</div>`;
return`<div class=cd><h3>${NM[sess.t]}</h3><button class=sm onclick="if(confirm('Descartar esta sessão?')){sess=null;R()}">Cancelar sessão</button></div>`+sess.ex.map((x,i)=>{const e=EX[sess.t][i],l=lastLoad(x.n);return`<div class=cd><h4>${e[0]}</h4><p class=m>${e[1]} · ${e[2]}×${e[3]}${l?' · última carga: '+l+' kg':''}<br>${e[4]}</p>`+x.sets.map((s,j)=>`<div class=row><span>S${j+1}</span><input type=number inputmode=decimal min=0 placeholder="kg" value="${s.c}" oninput="sess.ex[${i}].sets[${j}].c=this.value"><input type=number inputmode=numeric min=0 placeholder="reps" value="${s.r}" oninput="sess.ex[${i}].sets[${j}].r=this.value"><input type=checkbox ${s.ok?'checked':''} onchange="sess.ex[${i}].sets[${j}].ok=this.checked;if(this.checked)rest(S.cfg.desc)"></div>`).join('')+'</div>'}).join('')+form('musc')};
function form(t){return`<div class=cd><h3>Diário da sessão</h3><label>Data</label><input type=date id=fd value="${today()}"><label>Duração (min)</label><input id=fdur type=number inputmode=numeric><label>Intensidade percebida (0–10)</label><input id=frpe type=number inputmode=numeric min=0 max=10><label>Horas de sono</label><input id=fsono type=number inputmode=decimal><label>Fadiga (0–10)</label><input id=ffad type=number inputmode=numeric min=0 max=10><label>Dor no ombro (0–10)</label><input id=fdor type=number inputmode=numeric min=0 max=10><label>Observações</label><textarea id=fobs rows=2></textarea><button class=pb onclick="${t==='musc'?'saveS()':'saveQ()'}">Salvar sessão</button></div>`}
function readF(){const g=i=>$(i).value;const f={d:g('fd'),dur:g('fdur'),rpe:g('frpe'),sono:g('fsono'),fad:g('ffad'),dor:g('fdor'),obs:g('fobs').trim()};
if(!f.d)return alert('Informe a data.'),null;if(!num(f.dur,1,600))return alert('Duração: informe de 1 a 600 minutos.'),null;if(!num(f.rpe,0,10))return alert('Intensidade deve ser de 0 a 10.'),null;if(!num(f.sono,0,24))return alert('Horas de sono: de 0 a 24.'),null;if(!num(f.fad,0,10))return alert('Fadiga deve ser de 0 a 10.'),null;if(!num(f.dor,0,10))return alert('Dor no ombro deve ser de 0 a 10.'),null;
['dur','rpe','sono','fad','dor'].forEach(k=>f[k]=+f[k]);return f}
function pain(f){const p=[...S.log].reverse().find(e=>e.dor!=null);if(f.dor>=4||(p&&f.dor-p.dor>=2))setTimeout(()=>alert('⚠ Dor no ombro elevada ou piorando. Interrompa o movimento envolvido e procure seu fisioterapeuta. O app não faz diagnóstico nem libera exercícios.'),50)}
function saveS(){const f=readF();if(!f)return;const ex=sess.ex.map(x=>({n:x.n,sets:x.sets.filter(s=>s.ok).map(s=>({c:+s.c||0,r:+s.r||0,ok:true}))})).filter(x=>x.sets.length);if(!ex.length)return alert('Conclua ao menos uma série (marque a caixa).');
const bad=ex.some(x=>x.sets.some(s=>s.c<0||s.r<0));if(bad)return alert('Carga e repetições não podem ser negativas.');
const vol=ex.reduce((a,x)=>a+x.sets.reduce((b,s)=>b+s.c*s.r,0),0);pain(f);S.log.push({id:Date.now(),t:'musc',nome:NM[sess.t],ex,vol,...f});save();sess=null;sub.e='dia';go('evo')}
V.quadra=()=>`<div class=cd><h3>Treino de Quadra</h3><p class=m>Marque o que você vai fazer hoje.</p>`+Object.entries(Q).map(([c,a])=>`<h4 style="margin-top:14px;color:var(--o)">${c}</h4>`+a.map(x=>`<label class=ck><input type=checkbox class=qk value="${esc(x)}"><span>${x}</span></label>`).join('')).join('')+`<label>Desempenho da sessão (1–5)</label><select id=qd><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>`+form('q');
function saveQ(){const sel=[...document.querySelectorAll('.qk:checked')].map(x=>x.value);if(!sel.length)return alert('Marque ao menos uma atividade.');const f=readF();if(!f)return;pain(f);S.log.push({id:Date.now(),t:'quadra',nome:'Quadra: '+(sel.length>3?sel.slice(0,3).join(', ')+' +'+(sel.length-3):sel.join(', ')),at:sel,des:+$('qd').value,conc:true,...f});save();sub.e='dia';go('evo')}
V.tiro=()=>{const ts=S.tiro,cats=['Média distância','Três pontos','Lances livres','Bandejas e finalizações próximas'];const w={},m={};ts.forEach(e=>{const a=mon(e.d),b=e.d.slice(0,7);(w[a]=w[a]||[0,0]);w[a][0]+=e.a;w[a][1]+=e.t;(m[b]=m[b]||[0,0]);m[b][0]+=e.a;m[b][1]+=e.t});
return`<div class=cd><h3>Registrar arremessos</h3><label>Data</label><input type=date id=td value="${today()}"><label>Tipo</label><select id=tc>${cats.map(c=>`<option>${c}</option>`).join('')}</select><label>Tentados</label><input id=tt type=number inputmode=numeric min=1><label>Convertidos</label><input id=ta type=number inputmode=numeric min=0><button class=pb onclick="addT()">Salvar</button></div><div class=cd><h3>Aproveitamento semanal (%)</h3>${bars(Object.keys(w).sort().map(k=>[fd(k),pct(w[k][0],w[k][1])]),'%')}<h3>Mensal (%)</h3>${bars(Object.keys(m).sort().map(k=>[k.slice(5)+'/'+k.slice(2,4),pct(m[k][0],m[k][1])]),'%')}</div><div class=cd><h3>Registros</h3>${[...ts].reverse().map(e=>`<div class=day><div>${fd(e.d)} · ${e.c}<br><small class=m>${e.a}/${e.t} = ${pf(pct(e.a,e.t))}</small></div><button class=sm onclick="delT(${e.id})">Excluir</button></div>`).join('')||'<p class=m>Nenhum registro.</p>'}</div>`};
function addT(){const t=$('tt').value,a=$('ta').value;if(!$('td').value)return alert('Informe a data.');if(!num(t,1,2000))return alert('Tentativas: número inteiro maior que 0.');if(!num(a,0,2000))return alert('Convertidos: número válido.');if(+a>+t)return alert('Convertidos não pode ser maior que tentados.');S.tiro.push({id:Date.now(),d:$('td').value,c:$('tc').value,t:+t,a:+a});save();R()}
const delT=id=>{if(confirm('Excluir este registro?')){S.tiro=S.tiro.filter(e=>e.id!==id);save();R()}};
V.des=()=>{const[f,t]=range(),s=stats(f,t),w={},ld=[];s.es.forEach(e=>{if(e.vol){const k=mon(e.d);w[k]=(w[k]||0)+e.vol}});
const names=[...new Set(S.log.flatMap(e=>(e.ex||[]).map(x=>x.n)))];if(!exSel||!names.includes(exSel))exSel=names[0]||'';
S.log.forEach(e=>{const x=(e.ex||[]).find(x=>x.n===exSel);if(x&&e.d>=f&&e.d<=t){const c=x.sets.map(s=>s.c);ld.push([fd(e.d),Math.max(...c)])}});
return`<div class=cd><h3>Período</h3><button onclick="rg={p:'sem'};R()">Semana</button><button onclick="rg={p:'mes'};R()">Mês</button><button onclick="rg={p:'all'};R()">Tudo</button><div class=row><input type=date id=r1 value="${f}"><input type=date id=r2 value="${t}"></div><button onclick="rg={p:'c',f:$('r1').value,t:$('r2').value};R()">Aplicar período</button></div><div class=cd><div class=g><div class=st><b>${s.n}</b><small>Sessões</small></div><div class=st><b>${pf(s.ad)}</b><small>Adesão</small></div><div class=st><b>${s.vol}</b><small>Volume (kg)</small></div><div class=st><b>${s.min}</b><small>Min de quadra</small></div><div class=st><b>${pf(s.sh)}</b><small>Arremessos</small></div></div></div><div class=cd><h3>Volume de musculação por semana (kg)</h3>${bars(Object.keys(w).sort().map(k=>[fd(k),Math.round(w[k])]))}</div><div class=cd><h3>Evolução de carga (kg)</h3><select onchange="exSel=this.value;R()">${names.map(n=>`<option ${n===exSel?'selected':''}>${esc(n)}</option>`).join('')}</select>${bars(ld)}</div><div class=cd><h3>Recuperação — dor no ombro (0–10)</h3>${bars(s.es.filter(e=>e.dor!=null).slice(-10).map(e=>[fd(e.d),e.dor]))}<h3>Fadiga (0–10)</h3>${bars(s.es.filter(e=>e.fad!=null).slice(-10).map(e=>[fd(e.d),e.fad]))}</div>`};
V.dia=()=>`<div class=cd><h3>Histórico</h3>${[...S.log].sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).map(e=>`<div class=cd style="background:var(--c2)"><b>${fd(e.d)} · ${esc(e.nome)}</b><p class=m>${e.dur} min · intensidade ${e.rpe}/10 · sono ${e.sono}h · fadiga ${e.fad}/10 · dor ${e.dor}/10${e.vol?' · volume '+Math.round(e.vol)+' kg':''}${e.t==='quadra'?' · desempenho '+e.des+'/5'+(e.conc?' ✔':''):''}</p>${e.at?`<p class=m>${e.at.map(esc).join(' · ')}</p>`:''}${(e.ex||[]).map(x=>`<p class=m>${esc(x.n)}: ${x.sets.map(s=>s.c+'kg×'+s.r).join(', ')}</p>`).join('')}${e.obs?`<p>${esc(e.obs)}</p>`:''}<button class=sm onclick="editO(${e.id})">Editar obs.</button><button class=sm onclick="delL(${e.id})">Excluir</button></div>`).join('')||'<p class=m>Nenhuma sessão registrada ainda.</p>'}</div>`;
function editO(id){const e=S.log.find(x=>x.id===id),v=prompt('Observações:',e.obs||'');if(v!==null){e.obs=v.trim();save();R()}}
function delL(id){if(confirm('Excluir esta sessão? Não há como desfazer.')){S.log=S.log.filter(e=>e.id!==id);save();R()}}
V.cfg=()=>`<div class=cd><h3>Perfil</h3><p class=m>Atleta amador de basquete · armador/segundo armador · ~12 anos de musculação. Foco: força, potência, impulsão, velocidade lateral, resistência, arremessos, recuperação e prevenção de lesões. Lesão no ombro direito acompanhada por fisioterapeuta.</p></div><div class=cd><h3>Preferências</h3><label>Início do ciclo de 4 semanas</label><input type=date id=ci value="${S.cfg.ini}" onchange="S.cfg.ini=this.value;save();R()"><label>Descanso padrão entre séries (s)</label><input type=number id=cd value="${S.cfg.desc}" onchange="S.cfg.desc=Math.max(10,+this.value||90);save()"><label>Horários e compromissos</label><textarea rows=3 onchange="S.cfg.hor=this.value;save()">${esc(S.cfg.hor)}</textarea><button onclick="S.cfg.tema=S.cfg.tema==='l'?'d':'l';theme();save()">Alternar claro/escuro</button></div><div class=cd><h3>Backup</h3><p class=m>O app guarda uma cópia automática por dia (as últimas 7). Para ter uma cópia fora do app, salve o arquivo.</p>${snaps().map(x=>`<button class=sm onclick="rsn('${x.d}')">Restaurar ${fd(x.d)}</button>`).join('')}<button class=pb onclick="expF()">Salvar arquivo de backup</button><label>Restaurar de um arquivo</label><input type=file accept=".json,application/json" onchange="impF(this)"><details><summary class=m>Avançado: texto e CSV</summary><textarea id=bk rows=4></textarea><button onclick="gen()">Backup em texto</button><button onclick="csv()">Gerar CSV</button><button onclick="cp()">Copiar</button><button onclick="rest2()">Restaurar texto</button></details><button style="color:var(--r)" onclick="if(confirm('Apagar TODOS os dados?')&&confirm('Tem certeza? Faça backup antes.')){S=def();save();R()}">Apagar tudo</button></div>`;
function snap(){if(!S.log.length&&!S.tiro.length)return;try{let b=JSON.parse(localStorage.getItem('bp1bak')||'[]'),k=today(),x=JSON.stringify(S);if(b.length&&b[b.length-1].d===k)b[b.length-1].s=x;else b.push({d:k,s:x});localStorage.setItem('bp1bak',JSON.stringify(b.slice(-7)))}catch(e){}}
const snaps=()=>{try{return JSON.parse(localStorage.getItem('bp1bak')||'[]')}catch(e){return[]}};
function rsn(d){const x=snaps().find(e=>e.d===d);if(x&&confirm('Restaurar a cópia de '+fd(d)+'? Os dados atuais serão substituídos.')){S=Object.assign(def(),JSON.parse(x.s));save();theme();R()}}
async function expF(){const n='basket-backup-'+today()+'.json',f=new File([JSON.stringify(S)],n,{type:'application/json'});try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:n});return}}catch(e){if(e.name==='AbortError')return}try{const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=n;document.body.appendChild(a);a.click();a.remove();alert('Backup gerado: '+n+'. Se nada foi salvo, use "Avançado".')}catch(e){alert('Não foi possível gerar o arquivo. Use "Avançado".')}}
function impF(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.log)||!Array.isArray(d.tiro))throw 0;if(!confirm('Substituir os dados atuais por este backup?'))return;S=Object.assign(def(),d);save();theme();R();alert('Backup restaurado.')}catch(e){alert('Arquivo inválido.')}};r.readAsText(f)}
const gen=()=>$('bk').value=JSON.stringify(S);
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';let o='data;tipo;nome;duracao;rpe;sono;fadiga;dor_ombro;volume;obs\n'+S.log.map(e=>[e.d,e.t,e.nome,e.dur,e.rpe,e.sono,e.fad,e.dor,Math.round(e.vol||0),e.obs].map(q).join(';')).join('\n')+'\n\ndata;categoria;tentados;convertidos;aproveitamento\n'+S.tiro.map(e=>[e.d,e.c,e.t,e.a,pf(pct(e.a,e.t))].map(q).join(';')).join('\n');$('bk').value=o}
function cp(){const b=$('bk');b.select();try{navigator.clipboard.writeText(b.value);alert('Copiado.')}catch(e){document.execCommand('copy')}}
function rest2(){try{const d=JSON.parse($('bk').value);if(!Array.isArray(d.log)||!Array.isArray(d.tiro))throw 0;if(!confirm('Substituir os dados atuais pelo backup?'))return;S=Object.assign(def(),d);save();theme();R();alert('Backup restaurado.')}catch(e){alert('Backup inválido. Cole o texto JSON completo.')}}
let tm=null,left=0;const fm=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function rest(s){$('tb').style.display='flex';clearInterval(tm);left=s;$('tm').textContent=fm(left);tm=setInterval(()=>{left--;$('tm').textContent=fm(Math.max(left,0));if(left<=0){clearInterval(tm);beep()}},1000)}
const stopT=()=>{$('tb').style.display='none';clearInterval(tm);$('tm').textContent='0:00'};
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.5)}catch(e){}try{navigator.vibrate&&navigator.vibrate([300,100,300])}catch(e){}}
function theme(){if(S.cfg.tema)document.documentElement.dataset.t=S.cfg.tema;else delete document.documentElement.dataset.t}
function go(t){tab=t;R();scrollTo(0,0)}
function R(){$('app').innerHTML=V[tab]();$('tabs').innerHTML=TABS.map(([k,n,i])=>`<button class="${k===tab?'a':''}" onclick="go('${k}')"><span>${i}</span>${n}</button>`).join('')}
const seg=(k,o)=>`<div class=sg>${o.map(([a,n])=>`<button class="${sub[k]===a?'a':''}" onclick="sub.${k}='${a}';R()">${n}</button>`).join('')}</div>`;
V.treinar=()=>seg('t',[['musc','Musculação'],['quadra','Quadra'],['tiro','Arremessos']])+V[sub.t]();
V.evo=()=>seg('e',[['des','Resumo'],['dia','Histórico']])+V[sub.e]();
V.mais=V.cfg;
theme();R();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
